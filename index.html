<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inventor · Παρουσιάσεις</title>
<style>
@font-face{font-family:"Commissioner";font-weight:100 900;font-display:swap;src:url(welcome-stores-thessaloniki-2026/assets/fonts/commissioner-greek-wght-normal.woff2) format("woff2");unicode-range:U+0370-03FF}
@font-face{font-family:"Commissioner";font-weight:100 900;font-display:swap;src:url(welcome-stores-thessaloniki-2026/assets/fonts/commissioner-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"CommOutline";font-weight:900;src:url(welcome-stores-thessaloniki-2026/assets/fonts/commissioner-latin-900-solid.woff2) format("woff2")}
:root{--red:#e0101f;--ink:#f5f6f9;--mute:rgba(245,246,249,.6)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Commissioner",system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(70% 60% at 10% 0%,rgba(192,0,0,.45),transparent 70%),radial-gradient(60% 60% at 100% 100%,rgba(33,41,92,.9),transparent 70%),#05060a;
  -webkit-font-smoothing:antialiased;padding:56px 24px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header img{height:38px}
header span{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(40px,7vw,84px);font-weight:900;letter-spacing:-.03em;line-height:1;margin:72px 0 14px}
h1 em{font-family:"CommOutline",sans-serif;font-style:normal;color:transparent;-webkit-text-stroke:2px #fff}
p.lead{font-size:18px;color:var(--mute);max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-top:56px}
a.card{display:block;text-decoration:none;color:inherit;padding:30px;border-radius:26px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(18px);box-shadow:0 30px 70px rgba(0,0,0,.35);transition:transform .5s cubic-bezier(.22,1.45,.36,1),border-color .4s,box-shadow .4s}
a.card:hover{transform:translateY(-6px);border-color:rgba(255,110,120,.7);box-shadow:0 0 50px rgba(224,16,31,.35),0 30px 70px rgba(0,0,0,.4)}
.card .n{width:56px;height:56px;border-radius:50%;background:#fff;color:#07080d;display:grid;place-items:center;font-weight:900;font-size:28px}
.card h2{font-size:26px;line-height:1.2;margin:22px 0 10px}
.card .meta{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card .go{margin-top:26px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#ff4a57}
footer{margin-top:80px;font-size:12px;color:rgba(245,246,249,.35);letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="welcome-stores-thessaloniki-2026/assets/img/inventor-logo-white.png" alt="inventor"><span>Inventor A.G. · Part of BeijerRef</span></header>
  <h1>Παρουσιάσεις <em>Inventor</em></h1>
  <p class="lead">Διαδραστικές παρουσιάσεις για συνεργάτες και εκδηλώσεις.</p>
  <div class="grid">
    <!-- PRESENTATIONS: προσθέστε νέα κάρτα για κάθε υποφάκελο -->
    <a class="card" href="welcome-stores-thessaloniki-2026/">
      <div class="n">1</div>
      <h2>Πώς μοιάζει το αύριο όταν όλα σήμερα αλλάζουν;</h2>
      <div class="meta">Welcome Stores · Θεσσαλονίκη · 10/10/2026</div>
      <div class="go">Άνοιγμα παρουσίασης →</div>
    </a>
  </div>
  <footer>© Inventor A.G. Α.Ε.</footer>
</div>
</body>
</html>
